{% extends 'base.html' %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<h2>Admin Login</h2>
<form method="POST">
    {% csrf_token %}
    <div style="margin-bottom: 1rem;">
        <label>Username:</label>
        <input type="text" name="username" required style="width: 100%; padding: 0.5rem;">
    </div>
    <div style="margin-bottom: 1rem;">
        <label>Password:</label>
        <input type="password" name="password" required style="width: 100%; padding: 0.5rem;">
    </div>
    <button type="submit" style="padding: 0.5rem 1rem; background: #d4789d; color: white; border: none; border-radius: 3px;">Login</button>
</form>
{% endblock %}
