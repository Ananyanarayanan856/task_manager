{% extends 'base.html' %}

{% block title %}Update Status - {{ project.name }}{% endblock %}

{% block content %}
<h2>Update Project Status: {{ project.name }}</h2>

<form method="POST" style="max-width: 500px;">
    {% csrf_token %}
    
    <div style="margin-bottom: 1rem;">
        <label><strong>Current Status:</strong> {{ project.get_status_display }}</label>
    </div>
    
    <div style="margin-bottom: 1rem;">
        <label for="status">New Status:</label>
        <select name="status" id="status" style="width: 100%; padding: 0.5rem; border: 1px solid #e1d5ef; border-radius: 3px;">
            <option value="">-- Select Status --</option>
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
            <option value="completed">Completed</option>
        </select>
    </div>
    
    <p style="background: #F4EFFC; padding: 0.5rem; border-left: 4px solid #8a63c2; margin-bottom: 1rem;">
        <strong>Project:</strong> {{ project.name }}<br>
        <strong>Description:</strong> {{ project.description }}
    </p>
    
    <button type="submit" style="padding: 0.5rem 1rem; background: #9b72cf; color: white; border: none; border-radius: 3px;">Update Status</button>
    <a href="{% url 'member_dashboard' %}" style="margin-left: 0.5rem; padding: 0.5rem 1rem; background: #b49ccc; color: white; text-decoration: none; border-radius: 3px;">Cancel</a>
</form>
{% endblock %}
